[workspace]
members = [
    "crates/cast_loft",
    "crates/client",
    "crates/editor",
    "crates/engine",
    "crates/game_core",
    "crates/net",
    "crates/panel",
    "crates/physics",
    "crates/quality",
    "crates/renderer_api",
    "crates/renderer_wgpu",
    "crates/revolve",
    "crates/sdf",
    "crates/sdf_mesh",
    "crates/server",
    "crates/shell",
    "crates/solid",
    "crates/sweep",
    "crates/sim",
    "crates/terrain",
    "crates/vehicle_build",
    "crates/tools",
    "crates/vehicle_forge",
    "crates/vehicle_geometry",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
bevy_ecs = "0.18.0"
bincode = "1.3"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8.2"
egui = "0.34.3"
encase = "0.12"
glam = { version = "0.30", features = ["serde"] }
gltf = "1.4"
naga = { version = "29.0.3", features = ["wgsl-in"] }
pollster = "0.4"
rapier3d = { version = "0.32.0", default-features = false, features = ["dim3", "f32"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
wgpu = "29.0.3"
winit = "0.30.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
