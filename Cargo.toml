[workspace]
# Crates are grouped into layer folders (foundation/kernels/vehicle/runtime/render/apps/tooling);
# the glob picks up every crate one level inside `crates/`.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
bevy_ecs = "0.18.0"
cpal = "0.16"
bincode = "1.3"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8.2"
egui = "0.34.3"
encase = "0.12"
earcut = "0.4.10"
glam = { version = "0.30", features = ["serde"] }
gltf = "1.4"
meshopt = "0.6.2"
naga = { version = "29.0.3", features = ["wgsl-in"] }
parry3d = { version = "0.26.1", default-features = false, features = ["dim3", "f32"] }
pollster = "0.4"
rapier3d = { version = "0.32.0", default-features = false, features = ["dim3", "f32"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
wgpu = "29.0.3"
winit = "0.30.12"

# Internal workspace crates. Paths are centralized here so a crate directory move only edits this
# one block; each crate depends on them via `name.workspace = true`.
audio = { path = "crates/runtime/audio" }
cast_loft = { path = "crates/kernels/cast_loft" }
detail = { path = "crates/kernels/detail" }
engine = { path = "crates/runtime/engine" }
game_core = { path = "crates/foundation/game_core" }
net = { path = "crates/runtime/net" }
physics = { path = "crates/runtime/physics" }
renderer_api = { path = "crates/render/renderer_api" }
renderer_wgpu = { path = "crates/render/renderer_wgpu" }
revolve = { path = "crates/kernels/revolve" }
sdf = { path = "crates/kernels/sdf" }
sdf_mesh = { path = "crates/kernels/sdf_mesh" }
server = { path = "crates/apps/server" }
sim = { path = "crates/runtime/sim" }
solid = { path = "crates/kernels/solid" }
sweep = { path = "crates/kernels/sweep" }
terrain = { path = "crates/runtime/terrain" }
vehicle_build = { path = "crates/vehicle/vehicle_build" }
vehicle_forge = { path = "crates/vehicle/vehicle_forge" }
vehicle_geometry = { path = "crates/kernels/vehicle_geometry" }
experimental_geometry = { path = "crates/kernels/experimental_geometry" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
# Faster compiles and much faster linking: keep line numbers for readable backtraces but drop the
# heavy full debuginfo. Cuts artifact size and link time across the workspace.
debug = "line-tables-only"
# A playable dev build: opt-level 0 cannot hold 60 FPS with a 14-tank battle (the per-frame
# running-gear math and the 60 Hz sim both crawl unoptimized). Level 1 keeps compiles quick and
# the game responsive; use `cargo run --release -p client` for the real feel.
opt-level = 1

[profile.dev.package."*"]
# Dependencies are rarely stepped through in a debugger; stripping their debuginfo is one of the
# biggest single wins for link time on a large dependency graph (wgpu, rapier, image, ...).
# They compile once and land in the cache, so optimize them fully.
debug = false
opt-level = 3
