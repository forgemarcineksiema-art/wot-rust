[package]
name = "experimental_geometry"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

# No kernel is under evaluation right now, so no optional backend dependency is declared.
# Declaring one that does not build breaks `cargo <check|clippy|test> --all-features` for the
# WHOLE workspace, which is exactly what `fidget 0.4.3` did here — it fails to compile against
# the current toolchain, so a standard all-features invocation reported errors in third-party
# code nobody had asked for. Add the backend back beside its feature when it is actually being
# tried, and drop both again when the trial ends (see the crate docs for the shape).
[features]
default = []

[dependencies]
vehicle_geometry.workspace = true

[lints]
workspace = true
