# FEATURE UNIFICATION (Inny Poziom, 2026-09-06). This crate has no code. It declares the union of
# every feature any workspace member ever enables on a third-party crate, and every member depends
# on it, so `cargo test -p sim`, `cargo clippy --workspace --all-targets` and `cargo run -p client`
# resolve one and the same dependency graph. Before it, each of those invocations rebuilt what the
# previous one had built (measured: 696 units, 3 min, for a workspace test build straight after a
# per-crate one — with no source line changed). The section below is written by `cargo hakari
# generate` and checked by `cargo hakari verify`; the lock that matters is
# `quality/tests/feature_unification.rs`, which compares the resolved graphs directly.

[package]
name = "workspace_hack"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "workspace-hack package, managed by hakari: the union of third-party features, no code"
publish = false

[lints]
workspace = true
# The parts of the file between the BEGIN HAKARI SECTION and END HAKARI SECTION comments
# are managed by hakari.

### BEGIN HAKARI SECTION
[dependencies]
bitflags = { version = "2", default-features = false, features = ["serde", "std"] }
bytemuck = { version = "1", default-features = false, features = ["derive", "extern_crate_alloc", "min_const_generics"] }
byteorder = { version = "1" }
clap = { version = "4", features = ["derive"] }
clap_builder = { version = "4", default-features = false, features = ["color", "help", "std", "suggestions", "usage"] }
crossbeam-utils = { version = "0.8" }
downcast-rs = { version = "2", default-features = false, features = ["std", "sync"] }
either = { version = "1", default-features = false, features = ["use_std"] }
foldhash = { version = "0.2", default-features = false, features = ["std"] }
glam = { version = "0.30", features = ["approx", "nostd-libm", "serde"] }
half = { version = "2", default-features = false, features = ["num-traits"] }
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher", "equivalent", "inline-more", "raw-entry", "serde"] }
indexmap = { version = "2" }
log = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", features = ["i128", "libm"] }
regex-automata = { version = "0.4", default-features = false, features = ["dfa-build", "meta", "std"] }
serde = { version = "1", features = ["alloc", "derive"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "result", "std"] }
serde_json = { version = "1", features = ["raw_value"] }
smallvec = { version = "1", default-features = false, features = ["const_generics", "union"] }
thiserror = { version = "2" }
tracing-core = { version = "0.1" }

[build-dependencies]
indexmap = { version = "2" }
proc-macro2 = { version = "1" }
quote = { version = "1" }
syn = { version = "2", features = ["extra-traits", "full", "visit", "visit-mut"] }

[target.x86_64-pc-windows-msvc.dependencies]
